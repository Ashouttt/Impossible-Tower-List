<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Impossible Tower List — Top 1000</title>
<meta name="description" content="Ranking of the 1000 hardest Geometry Dash levels.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
<base target="_blank">
</head>
<body>

<header class="site-header" id="siteHeader">
  <div class="header-inner">
    <div class="header-brand">
      <h1>Impossible Tower List</h1>
      <span class="header-sub">Top 1000 — Geometry Dash</span>
    </div>
    <div class="header-meta">
      <div class="meta-pill">
        <span class="meta-num" id="statTotal">0</span>
        <span class="meta-label">levels</span>
      </div>
      <div class="meta-pill">
        <span class="meta-label">updated</span>
        <span class="meta-date" id="statUpdated">—</span>
      </div>
    </div>
  </div>
</header>

<main>
  <section class="controls-bar" id="controlsBar">
    <div class="controls-inner">
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" id="searchInput" placeholder="Search level, creator, or difficulty..." autocomplete="off">
      </div>
      <div class="tier-filters" id="tierFilters">
        <button class="tier-btn active" data-tier="all">All</button>
        <button class="tier-btn" data-tier="summit">Summit</button>
        <button class="tier-btn" data-tier="upper">Upper</button>
        <button class="tier-btn" data-tier="middle">Middle</button>
        <button class="tier-btn" data-tier="foundations">Foundations</button>
      </div>
    </div>
  </section>

  <section class="list-section">
    <div class="list-head" aria-hidden="true">
      <span class="col-rank">#</span>
      <span class="col-name">Level</span>
      <span class="col-difficulty">Difficulty</span>
      <span class="col-creator">Creator</span>
      <span class="col-chevron"></span>
    </div>
    <ol class="level-list" id="levelList"></ol>
    <p class="empty-state" id="emptyState" hidden>No levels match your search.</p>
    <button class="load-more" id="loadMoreBtn" hidden>Load more</button>
  </section>
</main>

<footer class="site-footer">
  <p>Impossible Tower List — community-maintained ranking.</p>
  <p class="footer-note">To add or edit levels, modify <code>levels.js</code>.</p>
</footer>

<script src="levels.js"></script>
<script src="script.js"></script>
</body>
</html>
