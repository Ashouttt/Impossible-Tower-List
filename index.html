<style>
  /* Online users counter */
  .online-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--text-muted);
    transition: background 200ms ease, box-shadow 200ms ease;
  }
  .online-dot.on  { background: var(--tier-verified);   box-shadow: 0 0 8px rgba(74, 222, 128, 0.6); }
  .online-dot.off { background: var(--tier-unverified); box-shadow: 0 0 8px rgba(248, 113, 113, 0.5); }

  /* =========================================================
     FEEDBACK (button in header + popup form + admin inbox)
     ========================================================= */

  .fb-open {
    font-family: var(--font-body);
    color: var(--text);
    cursor: pointer;
    transition: transform 180ms ease, background 180ms ease, border-color 180ms ease;
  }
  .fb-open:hover {
    background: var(--bg-3);
    border-color: var(--border-hover);
    transform: scale(1.03);
  }
  .fb-open svg { width: 15px; height: 15px; flex-shrink: 0; color: var(--accent); }
  .fb-open .meta-label { color: var(--text-dim); font-weight: 600; }

  .fb-modal {
    position: fixed;
    inset: 0;
    z-index: 200;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(7, 7, 9, 0.72);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  .fb-modal.open { display: flex; animation: fbFade 200ms ease both; }
  @keyframes fbFade { from { opacity: 0; } to { opacity: 1; } }

  .fb-card {
    width: 100%;
    max-width: 580px;
    max-height: min(92vh, 880px);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    color-scheme: dark;
    background: var(--bg-1);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: 0 24px 80px rgba(0, 0, 0, 0.6);
    animation: fbPop 300ms cubic-bezier(0.22, 1, 0.36, 1) both;
    transition: max-width 250ms ease;
  }
  .fb-card.wide { max-width: 780px; }
  @keyframes fbPop {
    from { opacity: 0; transform: translateY(12px) scale(0.98); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .fb-head {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 16px 22px;
    background: var(--bg-2);
    border-bottom: 1px solid var(--border);
  }
  .fb-head h3 { font-size: 18px; font-weight: 800; letter-spacing: -0.02em; color: var(--text); }

  .fb-x {
    width: 34px;
    height: 34px;
    display: grid;
    place-items: center;
    flex-shrink: 0;
    background: var(--bg-1);
    border: 1px solid var(--border);
    border-radius: 100px;
    color: var(--text-dim);
    cursor: pointer;
    transition: color 180ms ease, border-color 180ms ease, background 180ms ease;
  }
  .fb-x:hover { color: var(--text); border-color: var(--border-hover); background: var(--bg-3); }
  .fb-x svg { width: 16px; height: 16px; }

  .fb-body {
    padding: 22px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  .fb-body::-webkit-scrollbar { width: 6px; }
  .fb-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; }

  .fb-view[hidden] { display: none; }

  .fb-cats { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }

  .fb-field { margin-bottom: 14px; }
  .fb-field label {
    display: block;
    margin-bottom: 6px;
    font-family: var(--font-mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-muted);
  }
  .fb-req { margin-left: 3px; color: var(--accent); }
  .fb-note { margin-top: 6px; font-size: 12px; color: var(--text-muted); }

  .fb-card input[type="text"],
  .fb-card input[type="password"],
  .fb-card select,
  .fb-card textarea {
    width: 100%;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 11px 14px;
    color: var(--text);
    font-family: var(--font-body);
    font-size: 14px;
    transition: border-color 200ms, box-shadow 200ms;
  }
  .fb-card textarea { min-height: 100px; resize: vertical; line-height: 1.5; }
  .fb-card select {
    appearance: none;
    -webkit-appearance: none;
    cursor: pointer;
    padding-right: 38px;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238a8699' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/></svg>");
    background-repeat: no-repeat;
    background-position: right 12px center;
    background-size: 16px;
  }
  .fb-card ::placeholder { color: var(--text-muted); }
  .fb-card input:focus,
  .fb-card select:focus,
  .fb-card textarea:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(255, 107, 74, 0.12);
  }

  .fb-hp { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

  .fb-msg { min-height: 20px; margin: 2px 0 10px; font-size: 13px; line-height: 1.45; }
  .fb-msg.error { color: var(--tier-unverified); }
  .fb-msg.ok { color: var(--tier-verified); }

  .fb-submit {
    width: 100%;
    padding: 13px 18px;
    background: var(--accent);
    color: var(--bg-0);
    border: none;
    border-radius: var(--radius);
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 180ms ease, background 180ms ease, opacity 180ms ease;
  }
  .fb-submit:hover:not(:disabled) { background: var(--accent-2); transform: scale(1.01); }
  .fb-submit:disabled { opacity: 0.5; cursor: not-allowed; }

  .fb-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    font-size: 12px;
    color: var(--text-muted);
  }
  .fb-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 0;
    background: none;
    border: none;
    color: var(--text-dim);
    font-family: var(--font-body);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: color 180ms ease;
  }
  .fb-link:hover { color: var(--accent); }
  .fb-link svg { width: 14px; height: 14px; }

  .fb-ghost {
    padding: 8px 16px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 100px;
    color: var(--text-dim);
    font-family: var(--font-body);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 180ms ease;
  }
  .fb-ghost:hover { color: var(--text); border-color: var(--border-hover); background: var(--bg-3); }

  .fb-login-actions { display: flex; gap: 8px; margin-top: 4px; }
  .fb-login-actions .fb-submit { width: auto; flex: 1; }

  /* ----- Admin inbox ----- */
  .fb-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 16px; }
  .fb-toolbar .fb-spacer { flex: 1; }
  .fb-empty { padding: 40px 0; text-align: center; font-size: 14px; color: var(--text-muted); }

  .fb-item {
    position: relative;
    margin-bottom: 10px;
    overflow: hidden;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-left: 3px solid var(--border-hover);
    border-radius: 10px;
  }
  .fb-item[data-cat="tower"] { border-left-color: var(--tier-verified); }
  .fb-item[data-cat="bug"]   { border-left-color: var(--tier-unverified); }
  .fb-item[data-cat="other"] { border-left-color: var(--accent-gold); }

  .fb-item-top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 12px 16px; }
  .fb-badge {
    padding: 4px 10px;
    border: 1px solid transparent;
    border-radius: 100px;
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .fb-badge-tower { color: var(--tier-verified);   border-color: rgba(74, 222, 128, 0.35);  background: rgba(74, 222, 128, 0.08); }
  .fb-badge-bug   { color: var(--tier-unverified); border-color: rgba(248, 113, 113, 0.35); background: rgba(248, 113, 113, 0.08); }
  .fb-badge-other { color: var(--accent-gold);     border-color: rgba(240, 192, 64, 0.35);  background: rgba(240, 192, 64, 0.08); }

  .fb-who { font-family: var(--font-mono); font-size: 13px; font-weight: 700; color: var(--text); word-break: break-word; }
  .fb-time { margin-left: auto; font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); }

  .fb-del {
    padding: 4px 10px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 100px;
    color: var(--text-muted);
    font-family: var(--font-body);
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    transition: all 180ms ease;
  }
  .fb-del:hover { color: var(--tier-unverified); border-color: rgba(248, 113, 113, 0.5); }
  .fb-del.confirm { color: var(--bg-0); background: var(--tier-unverified); border-color: var(--tier-unverified); }

  .fb-dl { display: grid; gap: 10px; padding: 2px 16px 14px; }
  .fb-dl dt {
    margin-bottom: 3px;
    font-family: var(--font-mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-muted);
  }
  .fb-dl dd {
    margin: 0;
    font-size: 13.5px;
    line-height: 1.5;
    color: var(--text);
    white-space: pre-wrap;
    word-break: break-word;
    overflow-wrap: anywhere;
  }
  .fb-dl a { color: var(--accent-2); text-decoration: none; }
  .fb-dl a:hover { text-decoration: underline; }

  @media (max-width: 720px) {
    .fb-modal { padding: 10px; }
    .fb-body { padding: 18px; }
    .fb-card input[type="text"],
    .fb-card input[type="password"],
    .fb-card select,
    .fb-card textarea { font-size: 16px; }
    .fb-time { margin-left: 0; width: 100%; }
  }
</style>

<script>
/* Online users counter (Supabase Presence) — needs script.js loaded above (uses window.sbClient) */
(function () {
  var dot = document.getElementById("onlineDot");
  var num = document.getElementById("onlineCount");
  var sb = (typeof window.sbClient !== "undefined") ? window.sbClient : null;
  if (!sb) { dot.className = "online-dot off"; return; }

  // One ID per browser (shared by all its tabs) -> many tabs = 1 visitor
  var key = null;
  try { key = localStorage.getItem("tower_online_id"); } catch (e) {}
  if (!key) {
    key = (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
        : "u" + Date.now() + Math.random().toString(36).slice(2);
    try { localStorage.setItem("tower_online_id", key); } catch (e) {}
  }

  var ch = sb.channel("tower-list-online", { config: { presence: { key: key } } });

  function update() {
    num.textContent = Math.max(1, Object.keys(ch.presenceState()).length);
  }

  ch.on("presence", { event: "sync" }, update)
    .subscribe(function (status) {
      if (status === "SUBSCRIBED") {
        dot.className = "online-dot on";
        ch.track({ online_at: new Date().toISOString() });
        update();
      } else if (status === "CHANNEL_ERROR" || status === "TIMED_OUT" || status === "CLOSED") {
        dot.className = "online-dot off";
      }
    });
})();
</script>
<script>
/* =========================================================
   FEEDBACK — form + admin inbox (Supabase RPC)
   All security lives in the database (see feedback_setup.sql):
   validation, 5-minute cooldown and the admin password check
   happen on the server. This file only draws the UI.
   ========================================================= */
(function () {
  "use strict";

  var sb = (typeof window.sbClient !== "undefined") ? window.sbClient : null;

  var COOLDOWN_MS = 5 * 60 * 1000;
  var LS_LAST = "fb_last_sent";

  var LINK_ROBLOX = /^https:\/\/(www\.)?roblox\.com\/\S+$/i;
  var LINK_VIDEO  = /^https:\/\/(www\.|m\.)?(youtube\.com|youtu\.be)\/\S+$/i;

  /* Categories + their fields (must match the rules in feedback_setup.sql) */
  var CATS = {
    tower: {
      label: "Submit tower",
      fields: [
        { k: "tower_name",  label: "Tower name",              req: true,  max: 80,  ph: "e.g. Tower of Example" },
        { k: "creators",    label: "Creator(s)",              req: true,  max: 150, ph: "Separate with commas" },
        { k: "difficulty",  label: "Suggested difficulty",    req: false, max: 40,  ph: "e.g. Mid-High Nil" },
        { k: "roblox_link", label: "Roblox place link",       req: true,  max: 300, ph: "https://www.roblox.com/games/...", pattern: LINK_ROBLOX, err: "Roblox place link must start with https://www.roblox.com/" },
        { k: "video_link",  label: "Video / verification link", req: false, max: 300, ph: "YouTube link", pattern: LINK_VIDEO, err: "Video link must be a YouTube link (https://...)" },
        { k: "verifier",    label: "Verifier",                req: false, max: 60,  ph: "Who verified it, if anyone" },
        { k: "notes",       label: "Notes",                   req: false, max: 600, textarea: true, ph: "Anything else we should know?" }
      ]
    },
    bug: {
      label: "Bug report",
      fields: [
        { k: "section",     label: "Where did it happen?",    req: true,  max: 40,  select: ["Tower list", "Tower details / video", "Likes", "Other"] },
        { k: "title",       label: "Short title",             req: true,  max: 100, ph: "What is broken?" },
        { k: "description", label: "What happened? (steps to reproduce)", req: true, max: 1000, textarea: true, ph: "Describe the bug..." },
        { k: "browser",     label: "Browser / device",        req: false, max: 80,  ph: "e.g. Chrome on Windows" }
      ]
    },
    other: {
      label: "Other",
      fields: [
        { k: "subject",     label: "Subject",                 req: true,  max: 100, ph: "What is this about?" },
        { k: "message",     label: "Message",                 req: true,  max: 1000, textarea: true, ph: "Write your message..." }
      ]
    }
  };
  var ORDER = ["tower", "bug", "other"];

  function $(id) { return document.getElementById(id); }
  var modal = $("fbModal"), card = $("fbCard"), title = $("fbTitle");
  var openBtn = $("fbOpen"), closeBtn = $("fbClose");
  var views = { send: $("fbSendView"), login: $("fbLoginView"), admin: $("fbAdminView") };
  var catsBox = $("fbCats"), fieldsBox = $("fbFields"), form = $("fbForm");
  var discordIn = $("fbDiscord"), honeypot = $("fbWebsite"), msg = $("fbMsg"), submitBtn = $("fbSubmit");
  var loginForm = $("fbLoginForm"), pwIn = $("fbPassword"), loginMsg = $("fbLoginMsg"), loginBtn = $("fbLoginBtn");
  var filtersBox = $("fbFilters"), listBox = $("fbList"), adminMsg = $("fbAdminMsg");

  if (!modal || !openBtn) return;

  var currentCat = "tower";
  var sending = false;
  var tickTimer = null;

  var adminPw = null;   // kept in memory only, cleared on log out / closing the popup
  var items = [];
  var filter = "all";

  /* ---------- helpers ---------- */
  function deviceId() {
    var id = null;
    try { id = localStorage.getItem("tower_online_id"); } catch (e) {}
    if (!id) {
      id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
         : "d" + Date.now() + Math.random().toString(36).slice(2);
      try { localStorage.setItem("tower_online_id", id); } catch (e) {}
    }
    return id;
  }

  function setMsg(el, text, kind) {
    el.textContent = text || "";
    el.className = "fb-msg" + (kind ? " " + kind : "");
  }

  function fmtWait(ms) {
    var s = Math.ceil(ms / 1000);
    return Math.floor(s / 60) + ":" + ("0" + (s % 60)).slice(-2);
  }

  /* ---------- cooldown (UI only — the real one is enforced by the server) ---------- */
  function lastSent() {
    var t = 0;
    try { t = parseInt(localStorage.getItem(LS_LAST) || "0", 10) || 0; } catch (e) {}
    return t;
  }
  function markSent(agoMs) {
    try { localStorage.setItem(LS_LAST, String(Date.now() - (agoMs || 0))); } catch (e) {}
  }
  function cooldownLeft() {
    var left = COOLDOWN_MS - (Date.now() - lastSent());
    return left > 0 ? left : 0;
  }
  function refreshCooldown() {
    clearInterval(tickTimer);
    function paint() {
      var left = cooldownLeft();
      if (sending) return;
      if (left > 0) {
        submitBtn.disabled = true;
        submitBtn.textContent = "Wait " + fmtWait(left) + " to send again";
      } else {
        submitBtn.disabled = false;
        submitBtn.textContent = "Send feedback";
        clearInterval(tickTimer);
      }
    }
    paint();
    if (cooldownLeft() > 0) tickTimer = setInterval(paint, 1000);
  }

  /* ---------- views ---------- */
  function showView(name) {
    Object.keys(views).forEach(function (k) { views[k].hidden = (k !== name); });
    card.classList.toggle("wide", name === "admin");
    title.textContent = name === "login" ? "Admin log in" : name === "admin" ? "Feedback inbox" : "Feedback";
  }

  function openModal() {
    setMsg(msg, "");
    showView("send");
    modal.classList.add("open");
    document.body.style.overflow = "hidden";
    refreshCooldown();
    setTimeout(function () { discordIn.focus(); }, 60);
  }

  function logout() {
    adminPw = null;
    items = [];
    listBox.textContent = "";
    pwIn.value = "";
    setMsg(loginMsg, "");
    setMsg(adminMsg, "");
  }

  function closeModal() {
    modal.classList.remove("open");
    document.body.style.overflow = "";
    logout();
  }

  openBtn.addEventListener("click", openModal);
  closeBtn.addEventListener("click", closeModal);
  modal.addEventListener("mousedown", function (e) { if (e.target === modal) closeModal(); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && modal.classList.contains("open")) closeModal();
  });

  /* ---------- category buttons + dynamic fields ---------- */
  function makeCatButton(key, active, onClick, count) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "tier-btn" + (active ? " active" : "");
    b.textContent = (key === "all" ? "All" : CATS[key].label) + (count != null ? " " + count : "");
    b.addEventListener("click", onClick);
    return b;
  }

  function renderCats() {
    catsBox.textContent = "";
    ORDER.forEach(function (key) {
      catsBox.appendChild(makeCatButton(key, key === currentCat, function () {
        currentCat = key;
        setMsg(msg, "");
        renderCats();
        renderFields();
      }));
    });
  }

  function renderFields() {
    fieldsBox.textContent = "";
    CATS[currentCat].fields.forEach(function (f) {
      var wrap = document.createElement("div");
      wrap.className = "fb-field";

      var lab = document.createElement("label");
      lab.htmlFor = "fbf_" + f.k;
      lab.appendChild(document.createTextNode(f.label + (f.req ? " " : " (optional)")));
      if (f.req) {
        var star = document.createElement("span");
        star.className = "fb-req";
        star.textContent = "*";
        lab.appendChild(star);
      }

      var el;
      if (f.select) {
        el = document.createElement("select");
        var first = document.createElement("option");
        first.value = "";
        first.textContent = "Choose...";
        el.appendChild(first);
        f.select.forEach(function (opt) {
          var o = document.createElement("option");
          o.value = opt;
          o.textContent = opt;
          el.appendChild(o);
        });
      } else if (f.textarea) {
        el = document.createElement("textarea");
        el.rows = 4;
      } else {
        el = document.createElement("input");
        el.type = "text";
      }
      el.id = "fbf_" + f.k;
      el.name = f.k;
      el.autocomplete = "off";
      if (f.max && !f.select) el.maxLength = f.max;
      if (f.ph) el.placeholder = f.ph;

      wrap.appendChild(lab);
      wrap.appendChild(el);
      fieldsBox.appendChild(wrap);
    });
  }

  /* ---------- sending ---------- */
  function collect() {
    var data = {};
    var fields = CATS[currentCat].fields;
    for (var i = 0; i < fields.length; i++) {
      var f = fields[i];
      var el = $("fbf_" + f.k);
      var v = (el.value || "").replace(/\r\n/g, "\n").trim();
      if (f.req && !v) return { error: f.label + " is required.", el: el };
      if (v.length > f.max) return { error: f.label + " is too long (max " + f.max + ").", el: el };
      if (v && f.pattern && !f.pattern.test(v)) return { error: f.err || (f.label + " looks invalid."), el: el };
      if (v) data[f.k] = v;
    }
    return { data: data };
  }

  function friendlyError(code, wait) {
    if (code === "cooldown") return "Please wait " + fmtWait((wait || 300) * 1000) + " before sending another feedback.";
    if (code === "busy") return "We are getting a lot of feedback right now. Please try again in a few minutes.";
    return "Something in the form is not valid. Please check it and try again.";
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    if (sending) return;
    if (!sb) { setMsg(msg, "Feedback is unavailable right now.", "error"); return; }

    var left = cooldownLeft();
    if (left > 0) { setMsg(msg, "Please wait " + fmtWait(left) + " before sending another feedback.", "error"); return; }

    var discord = discordIn.value.replace(/\s+/g, " ").trim();
    if (discord.length < 2 || discord.length > 40) {
      setMsg(msg, "Enter your Discord username (2-40 characters).", "error");
      discordIn.focus();
      return;
    }

    var res = collect();
    if (res.error) { setMsg(msg, res.error, "error"); res.el.focus(); return; }

    sending = true;
    submitBtn.disabled = true;
    submitBtn.textContent = "Sending...";
    setMsg(msg, "");

    function done() { sending = false; refreshCooldown(); }

    sb.rpc("submit_feedback", {
      p_category: currentCat,
      p_discord: discord,
      p_data: res.data,
      p_device: deviceId(),
      p_website: honeypot.value || ""
    }).then(function (r) {
      var d = r && r.data;
      if (r && r.error) {
        console.warn("[Feedback] send error:", r.error.message);
        setMsg(msg, "Could not send feedback. Please try again later.", "error");
      } else if (d && d.ok) {
        setMsg(msg, "Thank you! Your feedback was sent.", "ok");
        markSent(0);
        renderFields();
      } else if (d && d.error === "cooldown") {
        markSent(COOLDOWN_MS - (d.wait || 300) * 1000);
        setMsg(msg, friendlyError("cooldown", d.wait), "error");
      } else {
        setMsg(msg, friendlyError(d && d.error), "error");
      }
      done();
    }, function () {
      setMsg(msg, "Could not send feedback. Check your connection and try again.", "error");
      done();
    });
  });

  /* ---------- admin: log in ---------- */
  $("fbToAdmin").addEventListener("click", function () {
    setMsg(loginMsg, "");
    pwIn.value = "";
    showView("login");
    setTimeout(function () { pwIn.focus(); }, 40);
  });

  $("fbLoginBack").addEventListener("click", function () {
    pwIn.value = "";
    showView("send");
  });

  function adminError(code) {
    if (code === "wrong") return "Wrong password.";
    if (code === "locked") return "Too many failed attempts. Try again in about 15 minutes.";
    if (code === "not_configured") return "Admin log in is not set up yet.";
    return "Could not log in. Please try again.";
  }

  function fetchAll(pw) { return sb.rpc("admin_get_feedback", { p_password: pw }); }

  loginForm.addEventListener("submit", function (e) {
    e.preventDefault();
    if (!sb) { setMsg(loginMsg, "Unavailable right now.", "error"); return; }
    var pw = pwIn.value;
    if (!pw) return;

    loginBtn.disabled = true;
    loginBtn.textContent = "Checking...";
    setMsg(loginMsg, "");

    fetchAll(pw).then(function (r) {
      var d = r && r.data;
      if (r && r.error || !d) {
        setMsg(loginMsg, "Could not reach the server. Please try again.", "error");
      } else if (!d.ok) {
        setMsg(loginMsg, adminError(d.error), "error");
        pwIn.value = "";
      } else {
        adminPw = pw;
        pwIn.value = "";
        items = d.items || [];
        filter = "all";
        setMsg(adminMsg, "");
        showView("admin");
        renderInbox();
      }
      setTimeout(function () { loginBtn.disabled = false; loginBtn.textContent = "Log in"; }, 800);
    }, function () {
      setMsg(loginMsg, "Could not reach the server. Please try again.", "error");
      loginBtn.disabled = false;
      loginBtn.textContent = "Log in";
    });
  });

  /* ---------- admin: inbox ---------- */
  function fieldLabel(cat, key) {
    var list = (CATS[cat] && CATS[cat].fields) || [];
    for (var i = 0; i < list.length; i++) if (list[i].k === key) return list[i].label;
    return key;
  }

  function fieldOrder(cat, data) {
    var keys = Object.keys(data || {});
    var order = ((CATS[cat] && CATS[cat].fields) || []).map(function (f) { return f.k; });
    keys.sort(function (a, b) {
      var ia = order.indexOf(a), ib = order.indexOf(b);
      return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
    });
    return keys;
  }

  function buildItem(it) {
    var cat = CATS[it.category] ? it.category : "other";

    var box = document.createElement("div");
    box.className = "fb-item";
    box.setAttribute("data-cat", cat);

    var top = document.createElement("div");
    top.className = "fb-item-top";

    var badge = document.createElement("span");
    badge.className = "fb-badge fb-badge-" + cat;
    badge.textContent = CATS[cat].label;

    var who = document.createElement("span");
    who.className = "fb-who";
    who.textContent = String(it.discord || "");

    var time = document.createElement("span");
    time.className = "fb-time";
    try { time.textContent = new Date(it.created_at).toLocaleString(); } catch (e) { time.textContent = ""; }

    var del = document.createElement("button");
    del.type = "button";
    del.className = "fb-del";
    del.textContent = "Delete";
    var delTimer = null;
    del.addEventListener("click", function () {
      if (!del.classList.contains("confirm")) {
        del.classList.add("confirm");
        del.textContent = "Sure?";
        delTimer = setTimeout(function () { del.classList.remove("confirm"); del.textContent = "Delete"; }, 3000);
        return;
      }
      clearTimeout(delTimer);
      del.disabled = true;
      sb.rpc("admin_delete_feedback", { p_password: adminPw, p_id: it.id }).then(function (r) {
        var d = r && r.data;
        if (d && d.ok) {
          items = items.filter(function (x) { return x.id !== it.id; });
          renderInbox();
        } else {
          del.disabled = false;
          del.classList.remove("confirm");
          del.textContent = "Delete";
          setMsg(adminMsg, d && d.error ? adminError(d.error) : "Could not delete.", "error");
        }
      });
    });

    top.appendChild(badge);
    top.appendChild(who);
    top.appendChild(time);
    top.appendChild(del);
    box.appendChild(top);

    var dl = document.createElement("dl");
    dl.className = "fb-dl";
    fieldOrder(it.category, it.data).forEach(function (k) {
      var val = String((it.data || {})[k] == null ? "" : it.data[k]);
      var wrap = document.createElement("div");
      var dt = document.createElement("dt");
      dt.textContent = fieldLabel(it.category, k);
      var dd = document.createElement("dd");
      if (/^https:\/\/\S+$/i.test(val)) {           // only real https links become clickable
        var a = document.createElement("a");
        a.href = val;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.textContent = val;
        dd.appendChild(a);
      } else {
        dd.textContent = val;                       // everything else is plain text (no HTML ever)
      }
      wrap.appendChild(dt);
      wrap.appendChild(dd);
      dl.appendChild(wrap);
    });
    box.appendChild(dl);

    return box;
  }

  function renderInbox() {
    // filter buttons with counts
    filtersBox.textContent = "";
    var counts = { all: items.length, tower: 0, bug: 0, other: 0 };
    items.forEach(function (it) { if (counts[it.category] != null) counts[it.category]++; });
    ["all"].concat(ORDER).forEach(function (key) {
      filtersBox.appendChild(makeCatButton(key, key === filter, function () {
        filter = key;
        renderInbox();
      }, counts[key]));
    });

    listBox.textContent = "";
    var shown = items.filter(function (it) { return filter === "all" || it.category === filter; });
    if (!shown.length) {
      var empty = document.createElement("p");
      empty.className = "fb-empty";
      empty.textContent = "No feedback here yet.";
      listBox.appendChild(empty);
      return;
    }
    shown.forEach(function (it) { listBox.appendChild(buildItem(it)); });
  }

  $("fbRefresh").addEventListener("click", function () {
    if (!adminPw) return;
    setMsg(adminMsg, "");
    fetchAll(adminPw).then(function (r) {
      var d = r && r.data;
      if (d && d.ok) {
        items = d.items || [];
        renderInbox();
      } else {
        setMsg(adminMsg, d && d.error ? adminError(d.error) : "Could not refresh.", "error");
      }
    });
  });

  $("fbLogout").addEventListener("click", function () {
    logout();
    showView("send");
  });

  /* ---------- init ---------- */
  renderCats();
  renderFields();
})();
</script>
</body>
</html>
